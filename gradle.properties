# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -XX:+UseG1GC -Dfile.encoding=UTF-8
# The Kotlin compile daemon is a separate process, and with no value set here it
# inherits org.gradle.jvmargs. At the old shared -Xmx2048m a compileDebugKotlin of
# this module exhausted the heap: old generation sat at 99.98 percent with 285 KB
# free, metaspace at 98 percent, and the daemon ran 950 full collections back to
# back reclaiming nothing, pinning all 8 logical cores for the better part of an
# hour. Give it its own heap, and a metaspace ceiling wide enough for the class
# volume the Compose compiler produces. G1 is deliberate rather than incidental:
# the default parallel collector kept freeing just enough per pass to stay under
# the GC-overhead limit, so it never threw OutOfMemoryError and never recovered
# either - it simply spun. G1 degrades under the same pressure instead of wedging.
kotlin.daemon.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
# org.gradle.parallel=true
# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# Enables namespacing of each library's R class so that its R class includes only the
# resources declared in the library itself and none from the library's dependencies,
# thereby reducing the size of the R class for that library
android.nonTransitiveRClass=true
# Caches the configuration phase so repeat builds skip re-evaluating the build scripts.
# Gradle 9 warns on every build until this is set; it becomes the default in a future release.
org.gradle.configuration-cache=true
# Reuses task outputs across builds, so an unchanged module is not handed to the
# Kotlin compiler again. Fewer full recompiles is the other half of keeping that
# daemon away from its heap ceiling on a four-core machine.
org.gradle.caching=true