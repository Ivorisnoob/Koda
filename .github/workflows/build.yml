name: Build APKs

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

env:
  TELEGRAM_CHAT_ID: "@ivorisnoob_projects"

jobs:
  # ── 1. Shared KMP module ─────────────────────────────────────────────────────
  # Compiles :shared independently so KMP issues are caught before the full
  # Android build runs.  Runs on every push/PR alongside the Android jobs.
  build-shared:
    name: Compile Shared KMP Module
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # Compile the Android target of the shared module (commonMain + androidMain)
    - name: Compile :shared (Android target)
      run: ./gradlew :shared:compileDebugKotlinAndroid --no-daemon

    # When iOS targets are uncommented in shared/build.gradle.kts, switch the
    # runner to macos-latest and enable the step below instead.
    # - name: Compile :shared (iOS targets)
    #   run: ./gradlew :shared:compileKotlinIosArm64 :shared:compileKotlinIosSimulatorArm64 --no-daemon
    #   (these task names are unambiguous once iOS targets are added)

  # ── 2. Debug APK ─────────────────────────────────────────────────────────────
  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest
    needs: build-shared   # don't waste time if shared module doesn't compile

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon

    - name: Upload Debug APK (Universal)
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-universal
        path: app/build/outputs/apk/debug/*universal*.apk
        if-no-files-found: error
        retention-days: 14

    - name: Upload Debug APK (arm64-v8a)
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-arm64-v8a
        path: app/build/outputs/apk/debug/*arm64-v8a*.apk
        if-no-files-found: error
        retention-days: 14

    - name: Upload Debug APK (armeabi-v7a)
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-armeabi-v7a
        path: app/build/outputs/apk/debug/*armeabi-v7a*.apk
        if-no-files-found: error
        retention-days: 14

  # ── 3. Release APK ───────────────────────────────────────────────────────────
  build-release:
    name: Build Release APK
    runs-on: ubuntu-latest
    needs: build-shared

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Decode keystore
      run: |
        mkdir -p keystore
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > keystore/ivormusic.jks

    - name: Build Release APK
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: ./gradlew assembleRelease --no-daemon

    - name: Upload Release APK (Universal)
      uses: actions/upload-artifact@v4
      with:
        name: app-release-universal
        path: app/build/outputs/apk/release/*universal*.apk
        if-no-files-found: error
        retention-days: 14

    - name: Upload Release APK (arm64-v8a)
      uses: actions/upload-artifact@v4
      with:
        name: app-release-arm64-v8a
        path: app/build/outputs/apk/release/*arm64-v8a*.apk
        if-no-files-found: error
        retention-days: 14

    - name: Upload Release APK (armeabi-v7a)
      uses: actions/upload-artifact@v4
      with:
        name: app-release-armeabi-v7a
        path: app/build/outputs/apk/release/*armeabi-v7a*.apk
        if-no-files-found: error
        retention-days: 14

  # ── 4. iOS Framework (disabled — enable when iOS targets are uncommented) ────
  # To activate:
  #   1. Uncomment the iosArm64/iosSimulatorArm64 targets in shared/build.gradle.kts
  #   2. Remove the 'if: false' line below
  #   3. Change the needs array in build-debug/build-release to include build-ios-framework
  #
  # build-ios-framework:
  #   name: Build iOS XCFramework
  #   if: false
  #   runs-on: macos-latest
  #   needs: build-shared
  #
  #   steps:
  #   - name: Checkout code
  #     uses: actions/checkout@v4
  #
  #   - name: Set up JDK 17
  #     uses: actions/setup-java@v4
  #     with:
  #       java-version: '17'
  #       distribution: 'temurin'
  #       cache: gradle
  #
  #   - name: Grant execute permission for gradlew
  #     run: chmod +x gradlew
  #
  #   - name: Build XCFramework
  #     run: ./gradlew :shared:assembleSharedXCFramework --no-daemon
  #
  #   - name: Upload XCFramework
  #     uses: actions/upload-artifact@v4
  #     with:
  #       name: Shared-XCFramework
  #       path: shared/build/XCFrameworks/release/
  #       retention-days: 14
