name: Build APKs & Desktop

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

env:
  TELEGRAM_CHAT_ID: "@ivorisnoob_projects"

jobs:
  # ── 1. Shared KMP module ─────────────────────────────────────────────────────
  build-shared:
    name: Compile Shared KMP Module
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # Compile both Android and Desktop targets of :shared
    - name: Compile :shared (Android target)
      run: ./gradlew :shared:compileDebugKotlinAndroid --no-daemon

    - name: Compile :shared (Desktop target)
      run: ./gradlew :shared:compileKotlinDesktop --no-daemon

    # When iOS targets are uncommented in shared/build.gradle.kts, switch the
    # runner to macos-latest and enable the step below instead.
    # - name: Compile :shared (iOS targets)
    #   run: ./gradlew :shared:compileKotlinIosArm64 :shared:compileKotlinIosSimulatorArm64 --no-daemon

  # ── 2. Debug APK ─────────────────────────────────────────────────────────────
  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest
    needs: build-shared

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon

    - name: Upload Debug APK (Universal)
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-universal
        path: app/build/outputs/apk/debug/*universal*.apk
        if-no-files-found: error
        retention-days: 14

    - name: Upload Debug APK (arm64-v8a)
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-arm64-v8a
        path: app/build/outputs/apk/debug/*arm64-v8a*.apk
        if-no-files-found: error
        retention-days: 14

    - name: Upload Debug APK (armeabi-v7a)
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-armeabi-v7a
        path: app/build/outputs/apk/debug/*armeabi-v7a*.apk
        if-no-files-found: error
        retention-days: 14

  # ── 3. Release APK ───────────────────────────────────────────────────────────
  build-release:
    name: Build Release APK
    runs-on: ubuntu-latest
    needs: build-shared

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Decode keystore
      run: |
        mkdir -p keystore
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > keystore/ivormusic.jks

    - name: Build Release APK
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: ./gradlew assembleRelease --no-daemon

    - name: Upload Release APK (Universal)
      uses: actions/upload-artifact@v4
      with:
        name: app-release-universal
        path: app/build/outputs/apk/release/*universal*.apk
        if-no-files-found: error
        retention-days: 14

    - name: Upload Release APK (arm64-v8a)
      uses: actions/upload-artifact@v4
      with:
        name: app-release-arm64-v8a
        path: app/build/outputs/apk/release/*arm64-v8a*.apk
        if-no-files-found: error
        retention-days: 14

    - name: Upload Release APK (armeabi-v7a)
      uses: actions/upload-artifact@v4
      with:
        name: app-release-armeabi-v7a
        path: app/build/outputs/apk/release/*armeabi-v7a*.apk
        if-no-files-found: error
        retention-days: 14

  # ── 4. Desktop — Linux (Deb) ──────────────────────────────────────────────────
  build-desktop-linux:
    name: Build Desktop App (Linux)
    runs-on: ubuntu-latest
    needs: build-shared

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Assemble Desktop JAR
      run: ./gradlew :desktopApp:assemble --no-daemon

    - name: Package Desktop (Deb)
      run: ./gradlew :desktopApp:packageDeb --no-daemon

    - name: Upload Linux Deb
      uses: actions/upload-artifact@v4
      with:
        name: koda-linux-deb
        path: desktopApp/build/compose/binaries/main/deb/*.deb
        if-no-files-found: error
        retention-days: 14

  # ── 5. Desktop — macOS (Dmg) ─────────────────────────────────────────────────
  build-desktop-macos:
    name: Build Desktop App (macOS)
    runs-on: macos-latest
    needs: build-shared

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Assemble Desktop JAR
      run: ./gradlew :desktopApp:assemble --no-daemon

    - name: Package Desktop (Dmg)
      run: ./gradlew :desktopApp:packageDmg --no-daemon

    - name: Upload macOS Dmg
      uses: actions/upload-artifact@v4
      with:
        name: koda-macos-dmg
        path: desktopApp/build/compose/binaries/main/dmg/*.dmg
        if-no-files-found: error
        retention-days: 14

  # ── 6. Desktop — Windows (Msi) ───────────────────────────────────────────────
  build-desktop-windows:
    name: Build Desktop App (Windows)
    runs-on: windows-latest
    needs: build-shared

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Build Desktop MSI
      run: ./gradlew :desktopApp:packageMsi --no-daemon

    - name: Upload Windows Msi
      uses: actions/upload-artifact@v4
      with:
        name: koda-windows-msi
        path: desktopApp/build/compose/binaries/main/msi/*.msi
        if-no-files-found: error
        retention-days: 14

  # ── 7. iOS Framework (disabled — enable when iOS targets are uncommented) ────
  # To activate:
  #   1. Uncomment the iosArm64/iosSimulatorArm64 targets in shared/build.gradle.kts
  #   2. Remove the 'if: false' line below
  #   3. Change the needs array in build-debug/build-release to include build-ios-framework
  #
  # build-ios-framework:
  #   name: Build iOS XCFramework
  #   if: false
  #   runs-on: macos-latest
  #   needs: build-shared
  #
  #   steps:
  #   - name: Checkout code
  #     uses: actions/checkout@v4
  #
  #   - name: Set up JDK 17
  #     uses: actions/setup-java@v4
  #     with:
  #       java-version: '17'
  #       distribution: 'temurin'
  #       cache: gradle
  #
  #   - name: Grant execute permission for gradlew
  #     run: chmod +x gradlew
  #
  #   - name: Build XCFramework
  #     run: ./gradlew :shared:assembleSharedXCFramework --no-daemon
  #
  #   - name: Upload XCFramework
  #     uses: actions/upload-artifact@v4
  #     with:
  #       name: Shared-XCFramework
  #       path: shared/build/XCFrameworks/release/
  #       retention-days: 14
