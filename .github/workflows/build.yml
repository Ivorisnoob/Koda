name: Build APKs

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

env:
  TELEGRAM_APK_CHAT_ID: "@ivorisnoob_chat"

jobs:
  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload Debug APK (Universal)
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-universal
        path: app/build/outputs/apk/debug/*universal*.apk
        if-no-files-found: error
        retention-days: 14

    - name: Upload Debug APK (arm64-v8a)
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-arm64-v8a
        path: app/build/outputs/apk/debug/*arm64-v8a*.apk
        if-no-files-found: error
        retention-days: 14

    - name: Upload Debug APK (armeabi-v7a)
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-armeabi-v7a
        path: app/build/outputs/apk/debug/*armeabi-v7a*.apk
        if-no-files-found: error
        retention-days: 14

  build-release:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Decode keystore
      run: |
        mkdir -p keystore
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > keystore/ivormusic.jks

    - name: Build Release APK
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: ./gradlew assembleRelease

    - name: Upload Release APK (Universal)
      uses: actions/upload-artifact@v4
      with:
        name: app-release-universal
        path: app/build/outputs/apk/release/*universal*.apk
        if-no-files-found: error
        retention-days: 14

    - name: Upload Release APK (arm64-v8a)
      uses: actions/upload-artifact@v4
      with:
        name: app-release-arm64-v8a
        path: app/build/outputs/apk/release/*arm64-v8a*.apk
        if-no-files-found: error
        retention-days: 14

    - name: Upload Release APK (armeabi-v7a)
      uses: actions/upload-artifact@v4
      with:
        name: app-release-armeabi-v7a
        path: app/build/outputs/apk/release/*armeabi-v7a*.apk
        if-no-files-found: error
        retention-days: 14

    - name: Send Release APKs to Telegram
      env:
        BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_TITLE: ${{ github.event.pull_request.title }}
        PR_URL: ${{ github.event.pull_request.html_url }}
        PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        COMMIT_MSG: ${{ github.event.head_commit.message }}
      run: |
        esc() { sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g' <<< "$1"; }

        VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts || echo "unknown")
        RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

        if [ -n "$PR_NUMBER" ]; then
          CONTEXT="PR <a href=\"${PR_URL}\">#${PR_NUMBER}</a>: $(esc "$PR_TITLE")
        By: <b>$(esc "$PR_AUTHOR")</b>"
        else
          FIRST_LINE="${COMMIT_MSG%%$'\n'*}"
          CONTEXT="Branch: <b>${{ github.ref_name }}</b>
        Commit: $(esc "$FIRST_LINE")
        By: <b>${{ github.actor }}</b>"
        fi

        CAPTION="<b>Koda</b> v${VERSION} | Release Build

        ${CONTEXT}
        SHA: <code>${GITHUB_SHA::7}</code>
        <a href=\"${RUN_URL}\">Workflow Run</a>"

        for apk in app/build/outputs/apk/release/*universal*.apk; do
          SIZE=$(stat -c%s "$apk")
          if [ "$SIZE" -gt 50000000 ]; then
            curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
              -d "chat_id=${{ env.TELEGRAM_APK_CHAT_ID }}" \
              -d "parse_mode=HTML" \
              --data-urlencode "text=<b>Koda</b> | $(esc "$(basename "$apk")") is over Telegram's 50 MB bot limit — grab it from the <a href=\"${RUN_URL}\">workflow artifacts</a>."
            continue
          fi
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument" \
            -F "chat_id=${{ env.TELEGRAM_APK_CHAT_ID }}" \
            -F "parse_mode=HTML" \
            -F "caption=${CAPTION}" \
            -F "document=@${apk}"
        done
