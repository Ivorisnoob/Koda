name: Build APKs

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

env:
  TELEGRAM_CHAT_ID: "@ivorisnoob_projects"

jobs:
  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload Debug APK (Universal)
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-universal
        path: app/build/outputs/apk/debug/*universal*.apk
        if-no-files-found: error
        retention-days: 14

    - name: Upload Debug APK (arm64-v8a)
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-arm64-v8a
        path: app/build/outputs/apk/debug/*arm64-v8a*.apk
        if-no-files-found: error
        retention-days: 14

    - name: Upload Debug APK (armeabi-v7a)
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-armeabi-v7a
        path: app/build/outputs/apk/debug/*armeabi-v7a*.apk
        if-no-files-found: error
        retention-days: 14

  build-release:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Decode keystore
      run: |
        mkdir -p keystore
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > keystore/ivormusic.jks

    - name: Build Release APK
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: ./gradlew assembleRelease

    - name: Upload Release APK (Universal)
      uses: actions/upload-artifact@v4
      with:
        name: app-release-universal
        path: app/build/outputs/apk/release/*universal*.apk
        if-no-files-found: error
        retention-days: 14

    - name: Upload Release APK (arm64-v8a)
      uses: actions/upload-artifact@v4
      with:
        name: app-release-arm64-v8a
        path: app/build/outputs/apk/release/*arm64-v8a*.apk
        if-no-files-found: error
        retention-days: 14

    - name: Upload Release APK (armeabi-v7a)
      uses: actions/upload-artifact@v4
      with:
        name: app-release-armeabi-v7a
        path: app/build/outputs/apk/release/*armeabi-v7a*.apk
        if-no-files-found: error
        retention-days: 14
